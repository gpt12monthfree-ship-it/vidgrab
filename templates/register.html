{% extends "base.html" %}
{% block title %}Create account · VidGrab Pro{% endblock %}

{% block body %}
<main class="auth-shell">
  <section class="auth-panel glass">
    <a href="/" class="brand brand--center">
      <span class="brand-mark"><i class="fa-solid fa-bolt"></i></span>
      <span class="brand-name">VidGrab<span class="brand-accent">Pro</span></span>
    </a>

    <h1 class="auth-heading">Create your account</h1>
    <p class="auth-sub">Free forever. No credit card required.</p>

    <form id="authForm" class="stack" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="control">
          <i class="fa-regular fa-user"></i>
          <input id="username" type="text" placeholder="yourname" minlength="3" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="control">
          <i class="fa-regular fa-envelope"></i>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="control">
          <i class="fa-solid fa-lock"></i>
          <input id="password" type="password" placeholder="At least 6 characters" minlength="6" required>
          <button type="button" class="ghost-icon" data-reveal="password" aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <div class="meter"><span id="meterBar"></span></div>
        <small id="meterText" class="hint">Password strength</small>
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">
        <span class="btn-label">Create account</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <p class="auth-foot">Already registered? <a href="/login">Sign in</a></p>
  </section>
</main>

<button class="theme-fab" data-theme-toggle aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll('[data-reveal]').forEach(b=>{
  b.onclick=()=>{const i=document.getElementById(b.dataset.reveal);
    i.type = i.type==='password' ? 'text':'password';
    b.innerHTML = i.type==='password' ? '<i class="fa-regular fa-eye"></i>':'<i class="fa-regular fa-eye-slash"></i>';};
});

const bar = document.getElementById('meterBar'), txt = document.getElementById('meterText');
password.addEventListener('input', () => {
  const v = password.value;
  let s = 0;
  if (v.length >= 6) s++; if (v.length >= 10) s++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
  if (/\d/.test(v)) s++; if (/[^\w]/.test(v)) s++;
  const pct = [0,20,40,60,80,100][s];
  const names = ['','Very weak','Weak','Fair','Strong','Excellent'];
  const cols = ['','#ef4444','#f59e0b','#eab308','#22c55e','#10b981'];
  bar.style.width = pct + '%';
  bar.style.background = cols[s] || 'transparent';
  txt.textContent = names[s] || 'Password strength';
});

document.getElementById('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.classList.add('is-loading'); btn.disabled = true;
  try {
    const r = await fetch('/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username: username.value.trim(),
        email: email.value.trim(),
        password: password.value
      })
    });
    const d = await r.json();
    if (d.ok) { toast('Account created 🎉','success'); setTimeout(()=>location.href=d.redirect,400); }
    else { toast(d.error,'error'); }
  } catch { toast('Network error. Try again.','error'); }
  btn.classList.remove('is-loading'); btn.disabled = false;
});
</script>
{% endblock %}
